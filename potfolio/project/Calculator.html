<!DOCTYPE html>
<html>
    <head>
        <title>Responsive Calculator</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@400..900&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">

    </head>

    <h3>Calculator</h3>

    <input class="display" type="text" value="0" readonly>

    <br>

    <button type="submit" onclick="add(num)" value="MC"> MC </button>
    <button type="submit" onclick="add(num)" value="MR"> MR </button>
    <button type="submit" onclick="add(num)" value="M+"> M+ </button>
    <button type="submit" onclick="add(num)" value="M-"> M- </button>
    <button type="submit" onclick="add(num)" value="RAD"> RAD </button>

    <br>

    <button type="submit" onclick="add(num)" value="INT"> INT </button>
    <button type="submit" onclick="add(num)" value="sin"> sin </button>
    <button type="submit" onclick="add(num)" value="cos"> cos </button>
    <button type="submit" onclick="add(num)" value="tan"> tan </button>
    <button type="submit" onclick="add(num)" value=""> C </button>

    <br>

    <button type="submit" onclick="add(num)" value="in"> in </button>
    <button type="submit" onclick="add(num)" value="iog"> log </button>
    <button type="submit" onclick="add(num)" value="("> ( </button>
    <button type="submit" onclick="add(num)" value=")"> ) </button>
    <button type="submit" onclick="add(num)" value=""> ⊠ </button>

    <br>

    <button type="submit" onclick="add(num)" value="√"> √ </button>
    <button type="submit" onclick="add(num)" value="^"> ∧ </button>
    <button type="submit" onclick="add(num)" value="">  </button>
    <button type="submit" onclick="add(num)" value=""> e </button>
    <button type="submit" onclick="add(op)" value="/"> ÷ </button>

    <br>

    <button type="submit" onclick="add(num)" value="7"> 7 </button>
    <button type="submit" onclick="add(num)" value="8"> 8 </button>
    <button type="submit" onclick="add(num)" value="9"> 9 </button>
    <button type="submit" onclick="add(num)" value=""> n! </button>
    <button type="submit" onclick="add(op)" value="*"> x </button>

    <br>

    <button type="submit" onclick="add(num)" value="4"> 4 </button>
    <button type="submit" onclick="add(num)" value="5"> 5 </button>
    <button type="submit" onclick="add(num)" value="6"> 6 </button>
    <button type="submit" onclick="add(num)" value="1/"> 1/x </button>
    <button type="submit" onclick="add(op)" value="-"> - </button>

    <br>

    <button type="submit" onclick="add(num)" value="1"> 1 </button>
    <button type="submit" onclick="add(num)" value="2"> 2 </button>
    <button type="submit" onclick="add(num)" value="3"> % </button>
    <button type="submit" onclick="add(num)" value="%"> % </button>
    <button type="submit" onclick="add(op)" value="+"> + </button>

    <br>
    
    <button type="submit" onclick="add(num)" value="."> . </button>
    <button type="submit" onclick="add(num)" value="0"> 0 </button>
    <button type="submit" onclick="add(eq)" value="="> = </button>
</html>
